# cargo-deny configuration for StellarGate
# Docs: https://embarkstudios.github.io/cargo-deny/

# ── Advisories ────────────────────────────────────────────────────────────────
# Mirrors the RustSec advisory database. cargo-deny fetches it automatically.
# Schema version 2: vulnerabilities, unsound and yanked crates are denied by
# default, so only the scope/ignore knobs need to be set explicitly.
[advisories]
version = 2
# Check every crate in the tree (not just the workspace) for unmaintained
# advisories — a supply-chain risk for a payments service.
unmaintained = "all"
# Advisories that are acknowledged and accepted, with justification.
#
# Every entry here is a temporary exception, not a permanent waiver. Each must
# carry a removal condition and a review date, and is re-examined on the
# schedule below (see also the weekly `cargo audit` cron in
# .github/workflows/supply-chain.yml). Remove an entry as soon as its removal
# condition is met.
ignore = [
    # RUSTSEC-2023-0071 — Marvin timing side-channel in `rsa`.
    #
    # Why ignored: `rsa` is pulled in only through sqlx's MySQL backend
    # (`sqlx-mysql`), which we do not enable — we depend on `sqlx` with the
    # `sqlite` feature only, so the vulnerable code is never compiled or
    # executed. It appears in Cargo.lock (and is therefore flagged by the
    # advisory scanners, which read the lockfile) purely as an optional,
    # unbuilt transitive dependency.
    #
    # Removal condition — drop this ignore as soon as ANY of these holds:
    #   1. A fixed `rsa` release is published (track RustSec advisory
    #      RUSTSEC-2023-0071 and https://github.com/RustCrypto/RSA/issues/19).
    #   2. `rsa` leaves the dependency tree entirely (e.g. sqlx removes the
    #      transitive path, or we drop the MySQL backend from resolution).
    #   3. StellarGate begins enabling sqlx's MySQL backend — in which case the
    #      code IS reachable and this must become a real fix, not an ignore.
    #
    # Review by: 2026-10-22 (quarterly). Tracking issue: StellarGateLabs#154.
    # Keep in sync with the `--ignore` flag in supply-chain.yml.
    { id = "RUSTSEC-2023-0071", reason = "rsa reachable only via sqlx's unenabled MySQL backend; no fixed release yet. Remove when fixed/removed upstream. Review by 2026-10-22. See StellarGateLabs#154." },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# Schema version 2: any crate whose license is not in `allow` (or covered by an
# exception) is denied.
[licenses]
version = 2
# Skip the workspace's own unpublished crate (`publish = false`), which is
# intentionally unlicensed; only third-party dependencies are license-checked.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # compiler-builtins and related LLVM crates
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",                             # ring and rustls-webpki, via the rustls TLS stack
    # webpki-roots — the Mozilla CA root store. A permissive *data* licence
    # (no copyleft, redistribution unrestricted) covering the certificate set
    # rather than code. Arrives with the rustls stack.
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",                # unicode-ident, icu_* and related crates
    "Unicode-3.0",                     # newer unicode-ident / icu_* releases
    "Zlib",                            # miniz_oxide and compression crates
]
# Note: "OpenSSL" was removed with the move to rustls (sqlx uses
# runtime-tokio-rustls, reqwest uses rustls-tls). openssl-sys is no longer in
# the tree, and keeping the allowance would let it return unnoticed.

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny any duplicate version that is not explicitly listed below. This turns
# the allow-list into an enforced contract: adding a new transitive duplicate
# breaks CI, forcing a conscious decision rather than silent bloat.
multiple-versions = "deny"
# Wildcard ("*") version requirements are allowed for now.
wildcards = "allow"

# Known duplicate versions as of 2026-08-20. Every entry below is a
# transitively-forced version split that cannot be resolved without waiting for
# upstream crates to unify on a single major. They are listed here so that
# `multiple-versions = "deny"` above rejects any *new* unregistered duplicate
# while keeping CI green for these known ones.
#
# Removal policy: when a dependency upgrade collapses two versions into one,
# remove the corresponding skip entry so the policy tightens automatically.

[[bans.skip]]
# rand 0.8 required by sqlx; 0.9 by governor; 0.10 by newer transitive deps.
# Collapse when sqlx and governor align on a single rand major.
name = "rand"
version = "=0.8.6"

[[bans.skip]]
name = "rand"
version = "=0.9.5"

[[bans.skip]]
# rand_chacha splits alongside rand majors.
name = "rand_chacha"
version = "=0.3.1"

[[bans.skip]]
# rand_core splits alongside rand majors.
name = "rand_core"
version = "=0.6.4"

[[bans.skip]]
name = "rand_core"
version = "=0.9.5"

[[bans.skip]]
# sha2 0.10 / digest 0.10 required by sqlx and hmac 0.12;
# sha2 0.11 / digest 0.11 required by hmac 0.13 (pulled by newer crypto stack).
name = "sha2"
version = "=0.10.9"

[[bans.skip]]
# digest splits alongside sha2 majors.
name = "digest"
version = "=0.10.7"

[[bans.skip]]
# hmac 0.12 required by sqlx; 0.13 required by our direct dep (webhooks).
name = "hmac"
version = "=0.12.1"

[[bans.skip]]
# crypto-common splits alongside the RustCrypto digest/sha2 version bump.
name = "crypto-common"
version = "=0.1.7"

[[bans.skip]]
# block-buffer splits alongside the RustCrypto digest/sha2 version bump.
name = "block-buffer"
version = "=0.10.4"

[[bans.skip]]
# tower-http 0.6 required by axum 0.7; 0.7 is pulled by a newer transitive dep.
# Collapse when axum bumps its tower-http requirement.
name = "tower-http"
version = "=0.6.11"

[[bans.skip]]
# getrandom 0.2 required by older rand/uuid transitive chain;
# 0.3 and 0.4 by newer chains.
name = "getrandom"
version = "=0.2.17"

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"

[[bans.skip]]
# hashbrown splits across multiple collections/indexmap majors.
name = "hashbrown"
version = "=0.14.5"

[[bans.skip]]
name = "hashbrown"
version = "=0.15.5"

[[bans.skip]]
# http 0.2 required by older tower/hyper chain; 1.x by newer axum/hyper stack.
name = "http"
version = "=0.2.12"

[[bans.skip]]
# const-oid splits across the RustCrypto version bump.
name = "const-oid"
version = "=0.9.6"

[[bans.skip]]
# cpufeatures splits across the RustCrypto version bump.
name = "cpufeatures"
version = "=0.2.17"

[[bans.skip]]
# r-efi splits between two platform-abstraction crate generations.
name = "r-efi"
version = "=5.3.0"

[[bans.skip]]
# redox_syscall splits between older/newer Redox platform crates.
name = "redox_syscall"
version = "=0.5.18"

[[bans.skip]]
# syn 2 and 3 coexist due to different proc-macro crates being at different
# migration stages. Collapse when all proc-macro deps unify on syn 3.
name = "syn"
version = "=2.0.117"

[[bans.skip]]
# thiserror 1.x required by older deps; 2.x by newer ones.
name = "thiserror"
version = "=1.0.69"

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"

[[bans.skip]]
# webpki-roots 0.26 required by older rustls chain; 1.x by newer one.
name = "webpki-roots"
version = "=0.26.11"

[[bans.skip]]
# windows-sys 0.48/0.52 required by older winapi consumers; 0.61 by newer ones.
name = "windows-sys"
version = "=0.48.0"

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"

[[bans.skip]]
# windows-targets and windows_* arch crates split alongside windows-sys.
name = "windows-targets"
version = "=0.48.5"

[[bans.skip]]
name = "windows_aarch64_gnullvm"
version = "=0.48.5"

[[bans.skip]]
name = "windows_aarch64_msvc"
version = "=0.48.5"

[[bans.skip]]
name = "windows_i686_gnu"
version = "=0.48.5"

[[bans.skip]]
name = "windows_i686_msvc"
version = "=0.48.5"

[[bans.skip]]
name = "windows_x86_64_gnu"
version = "=0.48.5"

[[bans.skip]]
name = "windows_x86_64_gnullvm"
version = "=0.48.5"

[[bans.skip]]
name = "windows_x86_64_msvc"
version = "=0.48.5"

[[bans.skip]]
# wit-bindgen splits between wasmtime generations pulled by different deps.
name = "wit-bindgen"
version = "=0.51.0"

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only crates.io is an allowed registry. Any git or path dependency that
# slips into Cargo.lock without being explicitly listed here will fail CI.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
